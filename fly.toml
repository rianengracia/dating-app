# fly.toml — TrueMatch deployment config
#
# Run `fly launch --no-deploy --copy-config --region sin` and pick a globally
# unique app name when prompted; flyctl will write the `app = "..."` line into
# this file automatically.

primary_region = "sin"

[build]
  dockerfile = "Dockerfile"

[env]
  HOST = "0.0.0.0"
  PORT = "3000"
  NODE_ENV = "production"

[deploy]
  release_command = "npx prisma migrate deploy"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

[[mounts]]
  source = "uploads"
  destination = "/app/public/uploads"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
  processes = ["app"]
