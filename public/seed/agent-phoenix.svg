<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" width="600" height="800">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1A1410"/>
      <stop offset="100%" stop-color="#5C2A1F"/>
    </linearGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M 48 0 L 0 0 0 48" fill="none" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="600" height="800" fill="url(#g)"/>
  <rect width="600" height="800" fill="url(#grid)"/>

  <!-- thin red diagonal bar -->
  <g transform="rotate(-20 300 400)">
    <rect x="-200" y="180" width="1000" height="6" fill="#FF4655" opacity="0.85"/>
    <rect x="-200" y="200" width="1000" height="2" fill="#FF4655" opacity="0.4"/>
  </g>

  <!-- accent geometry -->
  <polygon points="80,100 200,100 220,140 60,140" fill="#FF7A33" opacity="0.85"/>
  <polygon points="420,640 560,640 560,680 440,680" fill="#FF7A33" opacity="0.6"/>
  <circle cx="500" cy="180" r="60" fill="none" stroke="#FF7A33" stroke-width="2" opacity="0.6"/>
  <circle cx="500" cy="180" r="100" fill="none" stroke="#FF7A33" stroke-width="1" opacity="0.35"/>

  <!-- silhouette band -->
  <rect x="0" y="520" width="600" height="280" fill="#0F1923" opacity="0.55"/>

  <!-- callouts -->
  <text x="40" y="60" font-family="Consolas, monospace" font-size="14" letter-spacing="3" fill="#ECE8E1" opacity="0.7">TRUE//MATCH</text>
  <text x="560" y="60" text-anchor="end" font-family="Consolas, monospace" font-size="14" letter-spacing="3" fill="#FF4655">// AGENT</text>

  <!-- big initials -->
  <text x="40" y="700" font-family="Impact, 'Arial Black', sans-serif" font-size="220" font-weight="900" letter-spacing="6" fill="#ECE8E1">PH</text>

  <!-- footer line -->
  <text x="40" y="750" font-family="Consolas, monospace" font-size="14" letter-spacing="3" fill="#FF4655">▸ PHOENIX // AGE 29</text>
  <line x1="40" y1="765" x2="200" y2="765" stroke="#FF4655" stroke-width="2"/>
</svg>